name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Fabric
        run: ./gradlew :fabric:build --no-daemon --stacktrace

      - name: Build NeoForge
        run: ./gradlew :neoforge:build --no-daemon --stacktrace

      - name: Collect jars
        run: |
          mkdir -p dist
          cp fabric/build/libs/*.jar dist/ 2>/dev/null || true
          cp neoforge/build/libs/*.jar dist/ 2>/dev/null || true
          rm -f dist/*-sources.jar
          ls -la dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fasterchooseworld-jars
          path: dist/*.jar
          if-no-files-found: error
